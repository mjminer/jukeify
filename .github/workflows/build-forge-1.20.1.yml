name: Build Forge 1.20.1

on:
  push:
    branches: [ "main" ]
    paths:
      - "forge-1.20.1/**"
      - ".github/workflows/build-forge-1.20.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build Jukeify
        working-directory: forge-1.20.1
        run: gradle build --no-daemon --stacktrace

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: Jukeify-Forge-1.20.1-V0.2-dev
          path: forge-1.20.1/build/libs/*.jar
          if-no-files-found: error
