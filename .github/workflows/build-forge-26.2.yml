name: Build Forge 26.2

on:
  push:
    branches: [ "main" ]
    paths:
      - "forge-26.2/**"
      - ".github/workflows/build-forge-26.2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build Jukeify
        working-directory: forge-26.2
        run: gradle build --no-daemon --stacktrace

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: Jukeify-Forge-26.2-V0.2-dev
          path: forge-26.2/build/libs/*.jar
          if-no-files-found: error
